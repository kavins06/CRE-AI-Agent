name: CI
on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./init.sh
      - uses: actions/cache@v4
        id: docker
        with:
          path: .cache/docker-images.tar
          key: docker-${{ runner.os }}-${{ hashFiles('docker-compose.yml', 'docker/**/Dockerfile') }}
      - name: Restore Docker images
        if: steps.docker.outputs.cache-hit == 'true'
        run: docker load -i .cache/docker-images.tar
      - name: Cache Compose images
        if: steps.docker.outputs.cache-hit != 'true'
        run: |
          docker compose pull
          docker save $(docker compose config --images) -o .cache/docker-images.tar
      - run: make check

  test-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./init.sh
      - name: Compare committed collections
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: uv run python scripts/test_count.py --base "$BASE_SHA"

  verify-features:
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./init.sh
      - run: uv run python scripts/verify_features.py
