[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cre-brain"
version = "0.1.0"
description = "Deterministic tools and orchestration for a multifamily acquisitions analyst"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer==0.19.2",
    "pydantic==2.13.0",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
    "SQLAlchemy==2.0.43",
    "alembic==1.16.5",
    "psycopg[binary]==3.2.10",
    "aiosqlite==0.21.0",
    "openpyxl==3.1.5",
    "pyxirr==0.10.8",
    "zen-engine==2.1.2",
]

[project.scripts]
cre = "cre_brain.cli:main"

[project.optional-dependencies]
documents = ["docling==2.133.0", "reportlab==4.4.4", "pypdf==6.19.0"]
eval = ["inspect-ai==0.3.276"]
learning = ["gepa==0.1.4"]
jev = ["typesafe-sdk==0.7.2"]
runtime = [
    "fastapi==0.135.2",
    "starlette==1.3.1",
    "uvicorn==0.37.0",
    "mcp==1.28.1",
    "playwright==1.55.0",
    "unoserver==3.4",
    "opentelemetry-api==1.37.0",
    "opentelemetry-sdk==1.37.0",
    "opentelemetry-exporter-otlp-proto-http==1.37.0",
]
data = [
    "pandas==2.3.3",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
    "rapidfuzz==3.14.1",
    "beautifulsoup4==4.13.5",
]
memory = ["spacy==3.8.11"]

[dependency-groups]
dev = [
    "ruff==0.13.3",
    "mypy==1.18.2",
    "pytest==9.0.3",
    "hypothesis==6.140.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pre-commit==4.3.0",
    "types-PyYAML==6.0.12.20250915",
    "types-openpyxl==3.1.5.20250919",
    "pandas-stubs==2.3.2.250926",
    "respx==0.22.0",
    "packaging==25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cre_brain"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --basetemp=.cache/pytest"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: isolated external-service integration tests (not part of make check)",
]

[tool.coverage.run]
source = ["cre_brain"]
branch = true
