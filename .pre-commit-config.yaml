repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: uv run --locked ruff check
        language: system
        files: ^(src|tests)/
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check
        language: system
        files: ^(src|tests)/
        types: [python]
      - id: mypy
        name: strict source types
        entry: uv run --locked mypy src
        language: system
        pass_filenames: false
        types: [python]
        always_run: true
